<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>جلساتي</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%2334e3a6' stroke-width='5'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div>
          <div class="brand-name">جلساتي</div>
          <div class="brand-sub">جلسات Claude Code</div>
        </div>
        <button class="icon-btn theme-btn" id="themeBtn" title="تبديل الوضع" aria-label="تبديل الوضع">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.4 5.4 0 0 1-4.4 2.26 5.4 5.4 0 0 1-3.14-9.8C12.92 3.04 12.46 3 12 3Z"/></svg>
        </button>
      </div>

      <label class="search">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M10 2a8 8 0 0 1 6.32 12.9l5.39 5.4-1.41 1.4-5.4-5.38A8 8 0 1 1 10 2Zm0 2a6 6 0 1 0 0 12 6 6 0 0 0 0-12Z"/></svg>
        <input id="search" type="search" placeholder="ابحث في الجلسات…" autocomplete="off" />
        <kbd>/</kbd>
      </label>

      <nav class="nav" id="nav"></nav>

      <div class="nav-title">
        <span>المشاريع</span>
        <span class="muted" id="projCount"></span>
      </div>
      <div class="projects" id="projects"></div>
    </aside>

    <main class="main" id="main">
      <header class="hero">
        <div>
          <div class="greet" id="greet"></div>
          <h1 id="viewTitle">اليوم</h1>
        </div>
        <div class="hero-actions">
          <button class="btn ghost" id="refreshBtn" title="تحديث">
            <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M12 4a8 8 0 0 1 7.75 6H17.7A6 6 0 1 0 18 14h2.07A8 8 0 1 1 12 4Zm7-1v6h-6l2.24-2.24L19 3Z"/></svg>
            تحديث
          </button>
          <button class="btn primary" id="sumAllBtn">
            <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M11 2h2l1.2 4.8L19 8v2l-4.8 1.2L13 16h-2l-1.2-4.8L5 10V8l4.8-1.2L11 2Zm7 12h1.5l.6 2.4 2.4.6v1.5l-2.4.6-.6 2.4H18l-.6-2.4-2.4-.6V17l2.4-.6.6-2.4Z"/></svg>
            <span>لخّص الجلسات المعروضة</span>
          </button>
        </div>
      </header>

      <section class="stats" id="stats"></section>
      <div class="scan-bar" id="scanBar" hidden><span></span></div>
      <section id="list" class="list"></section>
    </main>

    <div class="scrim" id="scrim" hidden></div>
    <aside class="drawer" id="drawer" aria-hidden="true"></aside>
  </div>

  <div class="toast" id="toast" role="status"></div>
  <script src="app.js" type="module"></script>
</body>
</html>
