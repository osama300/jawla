<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0a0b0e" />
  <title>Dawra · دورة</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="vendor/xterm.css" />
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div class="brand-text">
          <div class="brand-name">Dawra <span>دورة</span></div>
          <div class="brand-sub" data-i18n="tagline"></div>
        </div>
      </div>

      <button class="palette-btn" id="paletteBtn">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M10 2a8 8 0 0 1 6.32 12.9l5.39 5.4-1.41 1.4-5.4-5.38A8 8 0 1 1 10 2Zm0 2a6 6 0 1 0 0 12 6 6 0 0 0 0-12Z"/></svg>
        <span data-i18n="pal.ph"></span>
        <kbd>⌘K</kbd>
      </button>

      <nav class="nav" id="mainNav"></nav>

      <div class="side-sec" id="openSec">
        <div class="side-title"><span data-i18n="nav.open"></span><span class="count" id="openCount"></span></div>
        <div id="openList" class="open-list"></div>
      </div>

      <div class="side-sec">
        <div class="side-title"><span data-i18n="nav.organize"></span></div>
        <nav class="nav" id="orgNav"></nav>
      </div>

      <div class="side-sec grow">
        <div class="side-title"><span data-i18n="nav.projects"></span><span class="muted" id="projCount"></span></div>
        <div class="projects" id="projects"></div>
      </div>

      <div class="side-foot">
        <button class="icon-btn" id="settingsBtn" data-i18n-title="nav.settings">
          <svg viewBox="0 0 24 24" width="17" height="17"><path fill="currentColor" d="M12 8a4 4 0 1 1 0 8 4 4 0 0 1 0-8Zm0 2a2 2 0 1 0 0 4 2 2 0 0 0 0-4Zm-1.5-8h3l.5 2.6a8 8 0 0 1 2 1.2l2.5-.9 1.5 2.6-2 1.7a8 8 0 0 1 0 2.4l2 1.7-1.5 2.6-2.5-.9a8 8 0 0 1-2 1.2L13.5 22h-3l-.5-2.6a8 8 0 0 1-2-1.2l-2.5.9L4 16.5l2-1.7a8 8 0 0 1 0-2.4l-2-1.7L5.5 8l2.5.9a8 8 0 0 1 2-1.2L10.5 2Z"/></svg>
        </button>
        <button class="icon-btn" id="themeBtn" data-i18n-title="pal.theme">
          <svg viewBox="0 0 24 24" width="17" height="17"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.4 5.4 0 0 1-4.4 2.26 5.4 5.4 0 0 1-3.14-9.8C12.92 3.04 12.46 3 12 3Z"/></svg>
        </button>
        <button class="icon-btn lang-btn" id="langBtn">EN</button>
        <span class="queue-ind" id="queueInd" hidden><span class="spinner"></span><span></span></span>
      </div>
    </aside>

    <main class="main" id="main">
      <section class="view" id="view-today"></section>
      <section class="view" id="view-sessions"></section>
      <section class="view work" id="view-work">
        <div class="work-tabs" id="workTabs"></div>
        <div class="work-body">
          <div class="ask-intro" id="askIntro" hidden></div>
          <div class="term-stage" id="termStage"></div>
        </div>
        <form class="composer" id="composer" hidden>
          <div class="chips" id="askChips"></div>
          <div class="composer-row">
            <textarea id="composerInput" rows="1" dir="auto"></textarea>
            <button class="btn primary" type="submit" data-i18n="term.send"></button>
          </div>
        </form>
      </section>
    </main>

    <div class="scrim" id="scrim" hidden></div>
    <aside class="drawer" id="drawer" aria-hidden="true"></aside>
  </div>

  <div class="modal-wrap" id="modal" hidden><div class="modal" role="dialog" aria-modal="true"></div></div>
  <div class="palette-wrap" id="palette" hidden>
    <div class="palette" role="dialog" aria-modal="true">
      <input id="palInput" autocomplete="off" />
      <div class="pal-list" id="palList"></div>
    </div>
  </div>
  <div class="toast" id="toast" role="status"></div>

  <script src="vendor/xterm.js"></script>
  <script src="vendor/addon-fit.js"></script>
  <script src="vendor/addon-web-links.js"></script>
  <script src="app.js" type="module"></script>
</body>
</html>
